# Wedding invitation details
# The couple names and wedding date below are your details.
# The venue illustration remains an example. Replace it before sharing.
# Save this file as UTF-8 to use names and messages in your preferred language.

site.title=Niraj & Tanaya | Wedding Invitation
site.description=Join us to celebrate our wedding with family and friends.
site.language=en-IN
# Public website root (HTTPS). Leave blank during local development.
# Set this before sharing to enable canonical URLs and complete link previews.
site.url=https://niraj-weds-tanaya.vercel.app/
# Optional guest contact: mailto:you@example.com, tel:+911234567890, or an HTTPS link.
# Hidden until configured; no contact information is invented.
contact.url=

couple.bride=Tanaya
couple.groom=Niraj
# Optional: leave blank until you want parent names displayed.
couple.groomParents=
couple.brideParents=
# Signs off the invitation at the very end, showing whose side it comes from.
family.signature=Patil Family
wedding.blessing=With the blessings of our families
wedding.message=Together with our families, we invite you to celebrate our wedding.
# Use an ISO date and time with a time-zone offset. +05:30 is India Standard Time.
wedding.dateTime=2026-11-25T12:45:00+05:30

venue.name=Rugved Celebration Central
venue.address=Dhondre Patil Landmark, Nanda Heights, Link Road, Golwadi Bypass, Chhatrapati Sambhajinagar, Golwadi, Maharashtra 431136
venue.mapsUrl=https://maps.app.goo.gl/cgdCtj5pnmaty4TH9?g_st=aw
venue.image=assets/images/venue.svg
venue.imageAlt=Decorative illustration of a wedding venue; replace with your venue photo

family.message=We look forward to celebrating this special day with you.

# Optional media: place your files under src/main/resources/static/assets/.
# Use an assets/... relative path or a complete HTTPS URL. Leave blank to use the built-in opening.
# Example: media.introVideo=assets/video/intro.mp4
media.introVideo=
# Example: media.musicSource=assets/audio/music.mp3
media.musicSource=assets/audio/jashn-e-bahaara-flute.mp3

# Story gallery. Add another numbered group and increase story.photos.count to add a photo.
story.subtitle=The little moments that brought us here, and the beautiful ones still to come.
story.photos.count=3
story.photos.1.source=assets/images/story-first-chapter.jpeg
story.photos.1.alt=Niraj and Tanaya walking hand in hand along a sunlit garden path
story.photos.1.title=Our first chapter
story.photos.1.caption=Every beautiful story begins with a little hello.
story.photos.2.source=assets/images/story-little-adventures.jpeg
story.photos.2.alt=Niraj and Tanaya smiling together on a motorcycle in an old city lane
story.photos.2.title=Little adventures
story.photos.2.caption=Finding our favourite moments in the everyday.
story.photos.3.source=assets/images/story-forever-begins.jpeg
story.photos.3.alt=Niraj and Tanaya in traditional wedding attire, smiling together
story.photos.3.title=Our forever begins
story.photos.3.caption=One beautiful promise. A lifetime of togetherness.

# Events, shown in this order. Use dateTime=wedding to automatically follow wedding.dateTime above.
# A blank mapsUrl uses venue.mapsUrl; it is used in the downloadable calendar files.
# Allowed icons: HALDI, MEHENDI, SANGEET, VIVAH, WEDDING. Increase/decrease events.count as needed.
events.count=4
